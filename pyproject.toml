[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linepulse-ai"
version = "1.0.0"
description = "Explainable failure intelligence for assembly-line Class A assets"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.40,<2",
  "uvicorn[standard]>=0.30,<1",
  "xgboost>=2.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
linepulse = ["py.typed"]

